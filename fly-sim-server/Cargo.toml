[package]
name = "fly-sim-server"
version = "0.1.0"
edition = "2021"

[dependencies]
fly-sim-core = { path = "../fly-sim-core" }
flyctrl-core = { path = "../../flyctrl/core" }
# HIL 链路层（USB-CDC / 虚拟口抽象）；真实串口后端经 phy feature 启用 realport。
fly-sim-hil = { path = "../fly-sim-hil" }
# 虚拟 MCU（Unicorn 模拟固件）：场景 "vperiph" 时作为 HIL 的 MCU 后端，
# 与真实 USB-CDC HIL 共用同一套 SimLoop::step_hil 闭环骨架（advance_hil）。
mcu_simulater = { path = "../../mcu_simulater" }
phy-sdk = { path = "../../physics/crates/phy-sdk", optional = true }
phy-rigid = { path = "../../physics/crates/phy-rigid", optional = true }
phy-math = { path = "../../physics/crates/phy-math", optional = true }
phy-demo = { path = "../../physics/crates/phy-demo", optional = true }
# 推帧 PNG 压缩：外网带宽 ~2.5Mbps，RGBA 帧(691KB/帧@8fps≈44Mbps)会被网络节流到
# ~0.4fps；PNG 压缩 3D 渲染帧 ~5-15%，带宽需求降 10×+。
png = "0.17"
# H.264 视频流编码（openh264，自包含 C 源码）：帧间压缩比 PNG 再省 ~10× 带宽，
# 支持多客户端/移动网络。前端 WebCodecs 解码，不支持时降级 PNG。
openh264 = "0.7"

[features]
default = []
phy = ["fly-sim-core/phy", "fly-sim-hil/realport", "phy-sdk", "phy-rigid", "phy-math", "phy-demo"]

[profile.release]
opt-level = 3
