[package]
name = "fly-sim-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# 飞控核心：SIL/HIL 共享控制律（no_std crate，host std 环境可依赖）。
flyctrl-core = { path = "../../flyctrl/core" }
# 共用 MAVLink v2 编解码核心（no_std 帧层 + 全消息编解码，单一事实来源）。
# 直接依赖 mavlink-core，帧层/编解码不再经 flyctrl-core 间接引用。
mavlink-core = { path = "../../mavlink-core" }
# 物理引擎（Rust 源码级依赖，rlib）。`phy` 为默认 feature：SIL/HIL 一律走真实引擎。
phy-sdk = { path = "../../physics/crates/phy-sdk", optional = true }
phy-rigid = { path = "../../physics/crates/phy-rigid", optional = true }
phy-math = { path = "../../physics/crates/phy-math", optional = true }
# 软件光栅化原语（Camera / Framebuffer），用于 3D 可视化（原生窗口 + Web 后端共用）。
phy-demo = { path = "../../physics/crates/phy-demo", optional = true }

[features]
# 真实物理引擎为默认（ToyWorld 替身已淘汰，删除前仅留 zz_engine_cmp 对照测例）。
default = ["phy"]
phy = ["phy-sdk", "phy-rigid", "phy-math"]
phy-render = ["phy", "phy-demo"]

[profile.release]
opt-level = 3
